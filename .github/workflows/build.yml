name: build-desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: fennec-desktop.exe
            gui: fennec-desktop-gui.exe
            rust: stable
          - os: macos-latest
            exe: fennec-desktop
            gui: fennec-desktop-gui
            rust: stable
          - os: ubuntu-latest
            exe: fennec-desktop
            gui: fennec-desktop-gui
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      # The app consumes fennec-client and fennec-economy by path, so the
      # native build fetches the repos together, exactly as the installer does.
      - uses: actions/checkout@v4
        with:
          path: fennec-desktop
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-core
          ref: v1.0.0
          path: fennec-core
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-economy
          ref: v1.0.0
          path: fennec-economy
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-ui
          ref: v1.0.0
          path: fennec-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Resolve package metadata
        id: package
        working-directory: fennec-desktop
        shell: bash
        run: |
          VERSION="$(python -c 'import re,pathlib; print(re.search(r"^version = \"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text(), re.M).group(1))')"
          case "$RUNNER_ARCH" in
            X64) ARCH=x86_64 ;;
            ARM64) ARCH=aarch64 ;;
            *) echo "unsupported RUNNER_ARCH: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASSET_ARCH=$ARCH" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}" >&2
            exit 1
          fi
      - name: Install windowing deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libasound2-dev
      - name: Test
        working-directory: fennec-desktop
        # `--features gui` because the gpui binary is `required-features = ["gui"]`:
        # without the flag cargo skips that target, so the shell users actually run
        # would be built but never tested.
        run: cargo test --release --features gui
      - name: Test packaging helpers
        working-directory: fennec-desktop
        run: python -m unittest discover -s packaging -p "test_*.py"
      # The `gui` feature is what users run: fennec-desktop-gui is the current
      # shell. Its release build compiles shaders with fxc.exe, which the SDK on
      # these runners provides and a bare dev box usually does not.
      - name: Build
        working-directory: fennec-desktop
        run: cargo build --release --features gui
      - name: Package portable binaries
        working-directory: fennec-desktop
        shell: bash
        run: |
          VERSION="${VERSION}"
          mkdir -p dist
          python - "$VERSION" <<'PY'
          import os, pathlib, re, sys, tarfile, zipfile
          version = sys.argv[1]
          release = pathlib.Path("target/release")
          names = ["fennec-desktop-gui", "fennec-desktop"]
          if sys.platform == "win32":
              names = [name + ".exe" for name in names]
          files = [release / name for name in names]
          missing = [str(source) for source in files if not source.is_file()]
          if missing:
              raise SystemExit("required desktop binaries missing: " + ", ".join(missing))
          runner_os = os.environ["RUNNER_OS"].lower()
          runner_arch = os.environ["RUNNER_ARCH"].upper()
          arch = {"X64": "x86_64", "ARM64": "aarch64"}.get(runner_arch)
          if arch is None:
              raise SystemExit(f"unsupported RUNNER_ARCH: {runner_arch}")
          platform = f"{runner_os}-{arch}"
          if sys.platform == "win32":
              asset = pathlib.Path("dist") / f"FennecDesktop-{version}-{platform}.zip"
              with zipfile.ZipFile(asset, "w", zipfile.ZIP_DEFLATED) as archive:
                  for source in files:
                      archive.write(source, source.name)
              extension = r"\.zip"
          else:
              asset = pathlib.Path("dist") / f"FennecDesktop-{version}-{platform}.tar.gz"
              with tarfile.open(asset, "w:gz") as archive:
                  for source in files:
                      archive.add(source, arcname=source.name)
              extension = r"\.tar\.gz"
          if re.fullmatch(rf"FennecDesktop-{re.escape(version)}-(windows|macos|linux)-(x86_64|aarch64){extension}", asset.name) is None:
              raise SystemExit(f"invalid desktop asset name: {asset.name}")
          if not asset.is_file():
              raise SystemExit(f"desktop asset was not created: {asset}")
          print(asset)
          PY
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: bash
        run: choco install nsis -y --no-progress
      - name: Package Windows installer
        if: runner.os == 'Windows'
        working-directory: fennec-desktop
        shell: bash
        run: python packaging/build_installer.py windows --version "$VERSION" --arch "$ASSET_ARCH" --binary target/release/fennec-desktop-gui.exe
      - name: Package macOS disk image and installer
        if: runner.os == 'macOS'
        working-directory: fennec-desktop
        shell: bash
        run: python packaging/build_installer.py macos --version "$VERSION" --arch "$ASSET_ARCH" --binary target/release/fennec-desktop-gui
      - name: Package Debian installer
        if: runner.os == 'Linux'
        working-directory: fennec-desktop
        shell: bash
        run: python packaging/build_installer.py linux --version "$VERSION" --arch "$ASSET_ARCH" --binary target/release/fennec-desktop-gui
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fennec-desktop-${{ matrix.os }}
          path: fennec-desktop/dist/*
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fennec-desktop
      - uses: actions/download-artifact@v4
        with:
          pattern: fennec-desktop-*
          path: dist
          merge-multiple: true
      - name: Verify installer set
        run: python fennec-desktop/packaging/build_installer.py validate --dist dist
      - name: Publish checksums and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
          python - <<'PY'
          import pathlib, re
          root = pathlib.Path("dist")
          assets = sorted(path.name for path in root.iterdir() if path.is_file() and path.name != "SHA256SUMS")
          if not assets:
              raise SystemExit("no release assets to checksum")
          names = []
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64}) [ *]([^/\\]+)", line)
              if match is None:
                  raise SystemExit(f"invalid checksum entry: {line!r}")
              names.append(match.group(2))
          if sorted(names) != assets:
              raise SystemExit("SHA256SUMS entries do not match release asset basenames")
          PY
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --notes "Fennec Desktop ${VERSION}. Native Rust/GPUI build with Windows setup wizard, macOS disk image and installer package, and Debian package. See CHANGELOG.md for the release record. Installers are unsigned; SAC remains off by user choice."
          gh release upload "$GITHUB_REF_NAME" dist/*
