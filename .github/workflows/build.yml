name: build-desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: fennec-desktop.exe
            rust: stable
          - os: macos-latest
            exe: fennec-desktop
            rust: stable
          - os: ubuntu-latest
            exe: fennec-desktop
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      # The app consumes fennec-client and fennec-economy by path, so the
      # native build fetches the repos together, exactly as the installer does.
      - uses: actions/checkout@v4
        with:
          path: fennec-desktop
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-core
          path: fennec-core
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-economy
          path: fennec-economy
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install windowing deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Test
        working-directory: fennec-desktop
        run: cargo test --release
      - name: Build
        working-directory: fennec-desktop
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fennec-desktop-${{ matrix.os }}
          path: fennec-desktop/target/release/${{ matrix.exe }}
