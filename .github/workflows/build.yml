name: build-desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: fennec-desktop.exe
            gui: fennec-desktop-gui.exe
            rust: stable
          - os: macos-latest
            exe: fennec-desktop
            gui: fennec-desktop-gui
            rust: stable
          - os: ubuntu-latest
            exe: fennec-desktop
            gui: fennec-desktop-gui
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      # The app consumes fennec-client and fennec-economy by path, so the
      # native build fetches the repos together, exactly as the installer does.
      - uses: actions/checkout@v4
        with:
          path: fennec-desktop
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-core
          path: fennec-core
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-economy
          path: fennec-economy
      - uses: actions/checkout@v4
        with:
          repository: Liso7150/fennec-ui
          path: fennec-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - name: Install windowing deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Test
        working-directory: fennec-desktop
        # `--features gui` because the gpui binary is `required-features = ["gui"]`:
        # without the flag cargo skips that target, so the shell users actually run
        # would be built but never tested.
        run: cargo test --release --features gui
      # The `gui` feature is what users run: fennec-desktop-gui is the current
      # shell. Its release build compiles shaders with fxc.exe, which the SDK on
      # these runners provides and a bare dev box usually does not.
      - name: Build
        working-directory: fennec-desktop
        run: cargo build --release --features gui
      - name: Package portable binaries
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          python - "$VERSION" <<'PY'
          import os, pathlib, sys, tarfile, zipfile
          version = sys.argv[1]
          release = pathlib.Path("target/release")
          names = ["fennec-desktop-gui", "fennec-desktop"]
          if sys.platform == "win32":
              names = [name + ".exe" for name in names]
          platform = f"{os.environ['RUNNER_OS'].lower()}-{os.environ['RUNNER_ARCH'].lower()}"
          files = []
          for name in names:
              source = release / name
              if source.is_file():
                  files.append(source)
          if not files:
              raise SystemExit("no desktop binaries to package")
          if sys.platform == "win32":
              asset = pathlib.Path("dist") / f"FennecDesktop-{version}-{platform}.zip"
              with zipfile.ZipFile(asset, "w", zipfile.ZIP_DEFLATED) as archive:
                  for source in files:
                      archive.write(source, source.name)
          else:
              asset = pathlib.Path("dist") / f"FennecDesktop-{version}-{platform}.tar.gz"
              with tarfile.open(asset, "w:gz") as archive:
                  for source in files:
                      archive.add(source, arcname=source.name)
          print(asset)
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fennec-desktop-${{ matrix.os }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fennec-desktop-*
          path: dist
          merge-multiple: true
      - name: Publish checksums and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*
