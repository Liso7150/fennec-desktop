[package]
name = "fennec-desktop"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Liso7150/fennec-desktop"
description = "Fennec desktop: a native Rust (egui) coding-agent workspace. UI and glue only — the backend protocols come from fennec-core's fennec-client crate, context budgeting from fennec-economy, and the suite layout from fennec-environment-setup's repos.json manifest."

[[bin]]
name = "fennec-desktop"
path = "src/main.rs"

[lib]
name = "fennec_desktop"
path = "src/lib.rs"

[dependencies]
eframe = "0.37"
image = { version = "0.24", default-features = false, features = ["png"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
fennec-client = { path = "../fennec-core/src/fennec-client" }
fennec-economy = { path = "../fennec-economy" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
