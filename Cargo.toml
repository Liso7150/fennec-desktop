[package]
name = "fennec-desktop"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Liso7150/fennec-desktop"
description = "Fennec desktop: a native Rust coding-agent workspace. UI and glue only — the backend protocols come from fennec-core's fennec-client crate, context budgeting from fennec-economy, and the suite layout from fennec-environment-setup's repos.json manifest. Ships the egui binary and the gpui-kit GUI binary."

[[bin]]
name = "fennec-desktop"
path = "src/main.rs"

[[bin]]
name = "fennec-desktop-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[lib]
name = "fennec_desktop"
path = "src/lib.rs"

[dependencies]
eframe = "0.37"
gpui-kit = { version = "0.10.0", optional = true }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "blocking"], default-features = false }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
fennec-client = { path = "../fennec-core/src/fennec-client" }
fennec-economy = { path = "../fennec-economy" }
fennec-ui = { path = "../fennec-ui" }
rfd = "0.15"
base64 = "0.22"
cpal = "0.15"
hound = "3.5"

[features]
default = []
gui = ["gpui-kit"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
