[package]
name = "fennec-desktop-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust desktop shell: the Electron agent logic (config, engine lifecycle, context, outlets, ACP) over HTTP, serving the web renderer and driving a bundled Chromium. Replaces fennec-desktop/electron/*.js."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
fennec-economy = { workspace = true }
fennec-outlets = { workspace = true }
fennec-acp = { workspace = true }

[[bin]]
name = "fennec-desktop-shell"
path = "src/main.rs"